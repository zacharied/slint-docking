[package]
name = "slint-docking-layout"
description = "The layout model behind slint-docking: a tree of splits and tab groups, with no UI dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
