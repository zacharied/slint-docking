[package]
name = "demo"
description = "A window to try slint-docking in, with panels that stand in for those of a chart editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
slint-docking = { workspace = true, features = ["serde"] }
# The winit feature tells where a window is on the screen, without its frame. It is
# needed only to take a dragged tab from one window to another.
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-docking-build = { workspace = true }
