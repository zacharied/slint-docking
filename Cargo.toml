[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT"

[workspace.dependencies]
slint-docking-layout = { path = "crates/slint-docking-layout" }
slint-docking-build = { path = "crates/slint-docking-build" }
slint-docking = { path = "crates/slint-docking" }
# The testing backend is an internal Slint crate, so it must match the Slint version exactly.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
slint-build = "=1.18.1"
i-slint-backend-testing = "=1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
